name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore for CI build
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sijil-alfahd-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Direct APK Download in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK_PATH" sijil-alfahd-debug.apk
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk sijil-alfahd-debug.apk --clobber
          else
            gh release create latest-apk sijil-alfahd-debug.apk \
              --title "سجل الفهد - أحدث نسخة APK" \
              --notes "نسخة Android APK مبنية تلقائياً من المشروع."
          fi
